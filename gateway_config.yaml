gateway_id: "gw-floor-1"

mqtt_host: "emqx.hvac.internal"
mqtt_port: 8883
mqtt_username: "gateway-01"
mqtt_password: "changeme"
mqtt_ca_cert:      "/certs/ca.crt"
mqtt_client_cert:  "/certs/gw-01.crt"
mqtt_client_key:   "/certs/gw-01.key"

heartbeat_interval_s: 5.0
broker_reconnect_delay_max_s: 60.0

rules_file: "/etc/edge/rules.json"
buffer_db:  "/var/edge/buffer.db"

units:
  - unit_id: "ac-unit-001"
    zone_id: "zone-floor-1-north"
    protocol: "mock"
    address: "0.0.0.0"
    poll_interval_s: 2.0
    setpoint: 22.0
    enabled: true

  - unit_id: "ac-unit-002"
    zone_id: "zone-floor-1-north"
    protocol: "mock"
    address: "0.0.0.0"
    poll_interval_s: 2.0
    setpoint: 22.0
    enabled: true

  - unit_id: "ac-unit-003"
    zone_id: "zone-floor-1-south"
    protocol: "modbus"
    address: "192.168.10.51:502"
    modbus_slave_id: 1
    poll_interval_s: 3.0
    setpoint: 21.0
    enabled: false   # set true when physical device connected
