## EMQX 5.x Configuration for HVAC Control System
## Reference: https://www.emqx.io/docs/en/v5.0/configuration/configuration.html

node {
  name = "hvac-broker@127.0.0.1"
  cookie = "hvac_cluster_secret_changeme"
  data_dir = "/opt/emqx/data"
}

cluster {
  name = hvac-cluster
  discovery_strategy = manual
}

dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
  default_username = "admin"
  default_password = "public"
}

## ── Listeners ────────────────────────────────────────────────────────────────

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 50000
  ## In production, disable plain TCP or restrict to localhost
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 50000
  ssl_options {
    cacertfile = "/opt/emqx/certs/ca.crt"
    certfile   = "/opt/emqx/certs/broker.crt"
    keyfile    = "/opt/emqx/certs/broker.key"
    verify     = verify_peer         ## enforce client certificates
    fail_if_no_peer_cert = true
    versions   = ["tlsv1.3", "tlsv1.2"]
    ciphers    = [
      "TLS_AES_256_GCM_SHA384",
      "TLS_AES_128_GCM_SHA256",
      "ECDHE-RSA-AES256-GCM-SHA384"
    ]
  }
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
  max_connections = 10000
}

## ── MQTT Settings ────────────────────────────────────────────────────────────

mqtt {
  max_qos_allowed = 1              ## cap QoS at 1 for performance
  retain_available = true
  max_packet_size = 256KB
  keepalive_multiplier = 1.5       ## allow 50% keepalive slack
  idle_timeout = 30s
  max_inflight = 32
  session_expiry_interval = 7200s  ## 2h retained session for edge gateways
}

## ── Authentication (file-based; replace with JWT/HTTP plugin in production) ──

authentication = [
  {
    mechanism = password_based
    backend   = built_in_database
    password_hash_algorithm {
      name = sha256
      salt_position = prefix
    }
  }
]

## ── Authorization (ACL) ──────────────────────────────────────────────────────
## For production: use HTTP/JWT authorization plugin with dynamic rules.

authorization {
  no_match = deny
  deny_action = disconnect

  sources = [
    {
      type = file
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}

## ── Rate Limiting ─────────────────────────────────────────────────────────────

rate_limit {
  max_conn_rate = 1000           ## new connections per second
  max_publish_rate = 5000        ## publishes per second across all clients
}

## ── Persistence ──────────────────────────────────────────────────────────────

retainer {
  enable   = true
  backend  = built_in_database
  max_retained_messages = 10000
  max_payload_size = 64KB
  msg_expiry_interval = 24h
}

## ── Monitoring ───────────────────────────────────────────────────────────────

prometheus {
  enable = true
  push_gateway_server = "http://prometheus:9091"
  interval = "15s"
}

telemetry {
  enable = false   ## disable usage telemetry to EMQX cloud
}
