%% EMQX ACL Configuration
%% Syntax: {allow | deny, who, action, topic_filters}
%%
%% Identity mapping (set via EMQX built-in DB or external auth plugin):
%%
%%   Client ID pattern     → Role
%%   unit-{id}             → AC unit (embedded device)
%%   gw-{id}               → Edge gateway
%%   hvac_backend          → Backend services (all services share one broker user)
%%   simulator             → Simulator (dev/test only)
%%   admin                 → Superuser
%%
%% Topics:
%%   ac/unit/{unit_id}/telemetry      → published by unit/gateway
%%   ac/unit/{unit_id}/command        → published by backend/gateway
%%   ac/unit/{unit_id}/heartbeat      → published by unit/gateway
%%   ac/unit/{unit_id}/response       → published by unit/gateway (command ACK)
%%   ac/unit/{unit_id}/telemetry/processed → internal backend
%%   ac/zone/{zone_id}/state          → published by backend (retained)
%%   ac/system/alerts                 → published by any service
%%

%% ── Admin superuser ──────────────────────────────────────────────────────────
{allow, {user, "admin"}, all, ["#"]}.

%% ── Backend services ─────────────────────────────────────────────────────────
%% Backend can subscribe to all telemetry and heartbeat topics (wildcard)
{allow, {user, "hvac_backend"}, subscribe, [
    "ac/unit/+/telemetry",
    "ac/unit/+/telemetry/processed",
    "ac/unit/+/heartbeat",
    "ac/unit/+/response",
    "ac/zone/+/state",
    "ac/system/alerts"
]}.

%% Backend can publish commands, processed telemetry, zone state, and alerts
{allow, {user, "hvac_backend"}, publish, [
    "ac/unit/+/command",
    "ac/unit/+/telemetry/processed",
    "ac/zone/+/state",
    "ac/system/alerts"
]}.

%% ── Edge gateways ────────────────────────────────────────────────────────────
%% Gateways publish on behalf of multiple units; they need wildcard publish rights
%% In production, restrict each gateway to its assigned unit prefix (e.g., gw-01 → ac/unit/ac-unit-0{01-50}/*)

{allow, {clientid, "gw-*"}, subscribe, [
    "ac/unit/+/command"
]}.

{allow, {clientid, "gw-*"}, publish, [
    "ac/unit/+/telemetry",
    "ac/unit/+/heartbeat",
    "ac/unit/+/response",
    "ac/system/alerts"
]}.

%% ── AC units (direct MQTT, no gateway) ───────────────────────────────────────
%% Each unit can only publish to its own topics (client ID = unit ID)
%% and subscribe to its own command topic.

{allow, {clientid, "ac-unit-*"}, subscribe, [
    "ac/unit/${clientid}/command"
]}.

{allow, {clientid, "ac-unit-*"}, publish, [
    "ac/unit/${clientid}/telemetry",
    "ac/unit/${clientid}/heartbeat",
    "ac/unit/${clientid}/response"
]}.

%% ── Simulator (dev/test only – remove in production) ─────────────────────────
{allow, {user, "simulator"}, all, [
    "ac/unit/+/telemetry",
    "ac/unit/+/heartbeat",
    "ac/unit/+/response",
    "ac/unit/+/command"
]}.

%% ── Default deny all ────────────────────────────────────────────────────────
{deny, all, all, ["#"]}.
